modelRoles:
  slow: openrouter-half/moonshotai/kimi-k3:high
  advisor: openrouter-half/moonshotai/kimi-k3:high
  plan: modal-glm/nvidia/GLM-5.2-NVFP4:high
  task: modal-glm/nvidia/GLM-5.2-NVFP4:high
  commit: modal-glm/nvidia/GLM-5.2-NVFP4:high
  smol: modal-glm/nvidia/GLM-5.2-NVFP4:high
  tiny: modal-glm/nvidia/GLM-5.2-NVFP4:high
  default: openrouter-half/moonshotai/kimi-k3
extensions:
  - ~/Projects/jong-pi-extensions/packages/diff-review
browser:
  headless: false
defaultThinkingLevel: xhigh
autoResume: true
memory:
  backend: local
edit:
  mode: hashline
github:
  enabled: true
secrets:
  enabled: true
theme:
  dark: titanium
statusLine:
  sessionAccent: true
  showHookStatus: true
terminal:
  showImages: true
images:
  autoResize: true
display:
  showTokenUsage: false
setupVersion: 1
retry:
  maxRetries: 3
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      &default
      - openrouter-half/openai/gpt-5.6-sol:high
      - openrouter-half/anthropic/claude-fable-5:high
      - modal-glm/nvidia/GLM-5.2-NVFP4:high
    slow:
      *default
    advisor:
      *default
    plan:
      &plan
      - openrouter-half/openai/gpt-5.6-terra:high
      - openrouter/z-ai/glm-5.2:high
      - openrouter-half/anthropic/claude-opus-4.8:high
    task:
      *plan
    commit:
      *plan
    smol:
      &smol
      - openrouter-half/openai/gpt-5.6-luna:high
      - openrouter/anthropic/claude-sonnet-5:high
    tiny:
      *smol
