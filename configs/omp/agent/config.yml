modelRoles:
  slow: modal-k3/moonshotai/Kimi-K3:high
  advisor: modal/zai-org/GLM-5.3:high
  plan: modal-k3/moonshotai/Kimi-K3:high
  task: modal-k3/moonshotai/Kimi-K3:high
  commit: modal/zai-org/GLM-5.3:high
  smol: modal/zai-org/GLM-5.3:high
  tiny: modal/zai-org/GLM-5.3:high
  default: modal-k3/moonshotai/Kimi-K3
task:
  agentModelOverrides:
    code-reviewer: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    code-simplifier: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    comment-analyzer: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    pr-test-analyzer: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    silent-failure-hunter: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    type-design-analyzer: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    scout: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    designer: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    reviewer: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    librarian: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    task: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
    sonic: "modal/zai-org/GLM-5.3:high, modal-k3/moonshotai/Kimi-K3:high, openrouter-half/moonshotai/kimi-k3:high, openrouter-half/openai/gpt-5.6-sol:high"
extensions:
  - ~/Projects/omp-modal-handoff
browser:
  headless: true
defaultThinkingLevel: xhigh
autoResume: false
advisor:
  enabled: true
memory:
  backend: local
edit:
  mode: hashline
github:
  enabled: true
secrets:
  enabled: true
theme:
  dark: titanium
statusLine:
  sessionAccent: true
  showHookStatus: true
terminal:
  showImages: true
images:
  autoResize: true
display:
  showTokenUsage: false
setupVersion: 2
retry:
  maxRetries: 3
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      &default
      - modal-k3/moonshotai/Kimi-K3:high
      - openrouter-half/moonshotai/kimi-k3:high
      - openrouter-half/openai/gpt-5.6-sol:high
      - modal/zai-org/GLM-5.3:high
    slow:
      *default
    advisor:
      *default
    plan:
      &plan
      - modal-k3/moonshotai/Kimi-K3:high
      - openrouter-half/moonshotai/kimi-k3:high
      - openrouter-half/openai/gpt-5.6-terra:high
      - modal/zai-org/GLM-5.3:high
    task:
      *plan
    commit:
      - openrouter-half/openai/gpt-5.6-terra:high
      - openrouter/z-ai/glm-5.2:high
      - openrouter-half/anthropic/claude-opus-4.8:high
    smol:
      &smol
      - openrouter-half/openai/gpt-5.6-luna:high
      - openrouter/anthropic/claude-sonnet-5:high
    tiny:
      *smol
dev:
  autoqaConsent: denied
startup:
  quiet: true
bash:
  autoBackground:
    enabled: true
  patterns:
    - match: rm -rf /
      approval: deny
    - match: rm -rf --no-preserve-root*
      approval: deny
    - match: ":(){ :|:& };:*"
      approval: deny
    - match: mkfs*
      approval: deny
    - match: "*dd*of=/dev/*"
      approval: deny
    - match: shutdown*
      approval: deny
    - match: reboot*
      approval: deny
    - match: halt*
      approval: deny
    - match: rm -rf /*
      approval: prompt
    - match: rm -rf ~*
      approval: prompt
    - match: rm -rf $HOME*
      approval: prompt
    - match: rm -fr /*
      approval: prompt
    - match: rm -fr ~*
      approval: prompt
    - match: curl * | sh
      approval: prompt
    - match: curl * | bash
      approval: prompt
    - match: wget * | sh
      approval: prompt
    - match: wget * | bash
      approval: prompt
    - match: git push --force*
      approval: prompt
    - match: git push -f*
      approval: prompt
    - match: git reset --hard*
      approval: prompt
    - match: chmod -R * /*
      approval: prompt
    - match: chown -R * /*
      approval: prompt
    - match: kubectl delete *
      approval: prompt
    - match: kubectl apply *
      approval: prompt
    - match: kubectl replace *
      approval: prompt
    - match: kubectl patch *
      approval: prompt
    - match: kubectl scale *
      approval: prompt
    - match: kubectl drain *
      approval: prompt
    - match: kubectl cordon *
      approval: prompt
    - match: kubectl edit *
      approval: prompt
    - match: kubectl create *
      approval: prompt
    - match: aws * delete-*
      approval: prompt
    - match: aws * terminate-*
      approval: prompt
    - match: aws * stop-*
      approval: prompt
    - match: aws * reboot-*
      approval: prompt
    - match: aws * deregister-*
      approval: prompt
eval:
  js: false
checkpoint:
  enabled: true
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
disabledProviders:
  - claude
  - opencode
composer:
  shape: claude
tui:
  textSizing: true
spelling:
  typoDetection: false
  autocomplete: false
doubleEscapeAction: tree