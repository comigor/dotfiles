chart:
  name: dynamo
  repoURL: https://github.com/decade-eng/infra-apps
  targetRevision: v2

# All DynamoDB tables for this domain live here, keyed by table name.
# Append new tables under `tables:` rather than creating sibling files.
#
# Source the schema from `decade-eng/infra:cmd/platform/main.go`
# (Pulumi `dynamodb.CreateDynamoTable`) and the referenced Go struct or
# .proto file. Map:
#   dynamo:"col,hash"           -> hashKey: col
#   dynamo:"col,range"          -> rangeKey: col
#   index:"name,hash"           -> globalSecondaryIndexes[].{name, hashKey}
#   index:"name,range"          -> globalSecondaryIndexes[].rangeKey
#   EnableStreams: true         -> streamEnabled: true
#   StreamViewType: ...         -> streamViewType: ...
#   KinesisStreamArn: ...       -> kinesisDestination.streamName: ...
#
# Attribute `type` values: S (string/uuid/enum), N (numeric), B (bytes).
# Only attributes that are part of the primary key or a GSI/LSI key need
# to be declared in `attributes:` — DynamoDB is schemaless for the rest.

tables:
  # --- Minimal: hashKey only ---
  example-simple:
    attributes:
      - name: hash_key
        type: S
    hashKey: hash_key

  # --- Composite primary key ---
  example-composite:
    attributes:
      - name: user_id
        type: S
      - name: type
        type: S
    hashKey: user_id
    rangeKey: type

  # --- hashKey + multiple GSIs ---
  example-with-gsis:
    attributes:
      - name: hash_key
        type: S
      - name: owner_id
        type: S
      - name: source_id
        type: S
    hashKey: hash_key
    globalSecondaryIndexes:
      - name: owner-id-index
        hashKey: owner_id
        projectionType: ALL
      - name: source-id-index
        hashKey: source_id
        projectionType: ALL

  # --- Streams + Kinesis CDC fan-out ---
  example-with-streams:
    attributes:
      - name: hash_key
        type: S
    hashKey: hash_key
    streamEnabled: true
    streamViewType: NEW_IMAGE
    kinesisDestination:
      streamName: example-cdc
