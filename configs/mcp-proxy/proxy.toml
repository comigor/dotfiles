[proxy]
name = "igor-mcp-gateway"
tool_exposure = "search"
hot_reload = true

[proxy.listen]
host = "127.0.0.1"
port = 8765

[[backends]]
name = "signoz"
transport = "stdio"
command = "/Users/igor/.local/bin/signoz-mcp-server"

[backends.env]
SIGNOZ_URL = "${SIGNOZ_URL}"
SIGNOZ_API_KEY = "${SIGNOZ_API_KEY}"
LOG_LEVEL = "warn"

[[backends]]
name = "argocd"
transport = "stdio"
command = "/Users/igor/.local/share/mise/installs/node/latest/bin/argocd-mcp"
args = ["stdio"]

[backends.env]
ARGOCD_BASE_URL = "${ARGOCD_MCP_URL}"
ARGOCD_API_TOKEN = "${ARGOCD_MCP_TOKEN}"

# reload-probe
